def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
	apply plugin: 'com.android.application'
} else {
	apply plugin: 'com.android.library'
}

android {
	ndkVersion '29.0.14206865'
	compileSdk 35
	defaultConfig {
		if (buildAsApplication) {
			// AYN Thor edition: installs next to the regular DevilutionX app
			applicationId "org.diasurgical.devilutionx.thor"
		}
		minSdkVersion 21
		targetSdkVersion 35
		versionCode 29
		versionName project.file('../../VERSION').text.trim() + '-thor' + project.file('../../THOR_VERSION').text.trim()
		externalNativeBuild {
			cmake {
				arguments "-DANDROID_STL=c++_static"
				// The AYN Thor is a 64-bit ARM device
				abiFilters 'arm64-v8a'
			}
		}
	}
	sourceSets.main {
		// Second screen companion UI (assets/companion/*). Kept outside of
		// src/main/assets, which is generated by the CMake build.
		assets.srcDirs += 'src/main/companion-assets'
	}
	signingConfigs {
		thor {
			// Stable signing key so that new builds install as updates
			// (provided by CI secrets, see .github/workflows/AYN_Thor.yml)
			def keystore = System.getenv('THOR_KEYSTORE_FILE')
			if (keystore) {
				storeFile file(keystore)
				storePassword System.getenv('THOR_KEYSTORE_PASSWORD')
				keyAlias System.getenv('THOR_KEY_ALIAS')
				keyPassword System.getenv('THOR_KEY_PASSWORD')
			}
		}
	}
	buildTypes {
		debug {
			applicationIdSuffix ".dev"
		}
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
			signingConfig System.getenv('THOR_KEYSTORE_FILE') ? signingConfigs.thor : signingConfigs.debug
		}
	}
	namespace 'org.diasurgical.devilutionx'
	buildFeatures {
		buildConfig true
	}
	applicationVariants.all { variant ->
		tasks["merge${variant.name.capitalize()}Assets"]
			.dependsOn("externalNativeBuild${variant.name.capitalize()}")
	}
	if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
		sourceSets.main {
			jniLibs.srcDir 'libs'
		}
		externalNativeBuild {
			cmake {
				path '../../CMakeLists.txt'
				version "3.31.0+"
				buildStagingDirectory System.env.DevilutionX_Android_StagingDirectory
			}
		}

	}

	if (buildAsLibrary) {
		libraryVariants.all { variant ->
			variant.outputs.each { output ->
				def outputFile = output.outputFile
				if (outputFile != null && outputFile.name.endsWith(".aar")) {
					def fileName = "org.diasurgical.devilutionx.aar"
					output.outputFile = new File(outputFile.parent, fileName)
				}
			}
		}
	}
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'com.android.support.constraint:constraint-layout:2.0.4'
}
