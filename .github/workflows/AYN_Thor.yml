name: AYN Thor

# Builds DevilutionX Thor: an Android release APK (arm64) that shows the map,
# character, items and quests on the second screen of the AYN Thor.
#
# Signing: for new builds to install as updates (keeping saves and game data),
# every build must be signed with the same key. Add these repository secrets:
#   THOR_KEYSTORE_BASE64   base64 of the .jks keystore
#   THOR_KEYSTORE_PASSWORD keystore password
#   THOR_KEY_ALIAS         key alias
#   THOR_KEY_PASSWORD      key password
# Without them the APK is signed with the runner's throwaway debug key.
on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gettext smpq

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: gradle

    - name: Install CMake
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: android-project/app/.cxx
        key: ${{ github.workflow }}-v1-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v1-

    - name: Signing key
      env:
        THOR_KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$THOR_KEYSTORE_BASE64" ]; then
          echo "$THOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thor.jks"
          echo "THOR_KEYSTORE_FILE=$RUNNER_TEMP/thor.jks" >> "$GITHUB_ENV"
        else
          echo "::warning::No THOR_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key and cannot update a previous install."
        fi

    - name: Build
      working-directory: android-project
      env:
        THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        THOR_KEY_ALIAS: ${{ secrets.THOR_KEY_ALIAS }}
        THOR_KEY_PASSWORD: ${{ secrets.THOR_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: devilutionx-thor.apk
        path: android-project/app/build/outputs/apk/release/app-release.apk
