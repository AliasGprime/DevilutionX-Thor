name: AYN Thor

# Builds DevilutionX Thor: an Android release APK (arm64) that shows the map,
# character, items and quests on the second screen of the AYN Thor.
#
# Signing: for new builds to install as updates (keeping saves and game data),
# every build must be signed with the same key. Add these repository secrets:
#   THOR_KEYSTORE_BASE64   base64 of the .jks keystore
#   THOR_KEYSTORE_PASSWORD keystore password
#   THOR_KEY_ALIAS         key alias
#   THOR_KEY_PASSWORD      key password
# Without them the APK is signed with the runner's throwaway debug key.
#
# Releases: on the ayn-thor branch, when the version in THOR_VERSION has no
# release yet, the signed APK is published as release thor-v<version>.
# To publish a new version: bump THOR_VERSION and push.
on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gettext smpq

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install CMake
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: android-project/app/.cxx
        key: ${{ github.workflow }}-v1-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v1-

    - name: Signing key
      env:
        THOR_KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$THOR_KEYSTORE_BASE64" ]; then
          echo "$THOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thor.jks"
          echo "THOR_KEYSTORE_FILE=$RUNNER_TEMP/thor.jks" >> "$GITHUB_ENV"
        else
          echo "::warning::No THOR_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key and cannot update a previous install."
        fi

    - name: Build
      working-directory: android-project
      env:
        THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        THOR_KEY_ALIAS: ${{ secrets.THOR_KEY_ALIAS }}
        THOR_KEY_PASSWORD: ${{ secrets.THOR_KEY_PASSWORD }}
      # The app checks this repository's releases for updates at launch
      run: ./gradlew assembleRelease -PthorUpdateRepo="${{ github.repository }}"

    - name: Rename APK
      run: cp android-project/app/build/outputs/apk/release/app-release.apk devilutionx-thor.apk

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: devilutionx-thor.apk
        path: devilutionx-thor.apk

    - name: Publish release
      if: github.ref == 'refs/heads/ayn-thor'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="v$(tr -d '[:space:]' < THOR_VERSION)"
        tag="thor-${version}"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release $tag already exists, nothing to publish (bump THOR_VERSION to publish a new one)."
          exit 0
        fi
        if [ -z "$THOR_KEYSTORE_FILE" ]; then
          echo "::error::Not publishing an APK signed with a throwaway key: add the THOR_* secrets."
          exit 1
        fi
        cat > release-notes.md <<NOTES
        **DevilutionX Thor ${version}** : DevilutionX pour l'AYN Thor, avec la carte, le personnage, les objets et les quêtes sur l'écran du bas.

        ### Installation
        1. Télécharger \`devilutionx-thor.apk\` ci-dessous et l'installer sur le Thor.
        2. Copier \`DIABDAT.MPQ\` (et vos sauvegardes \`*.sv\`) dans \`Android/data/org.diasurgical.devilutionx.thor/files/\`.
        3. Lancer **DevilutionX Thor** : l'écran du bas s'allume automatiquement.

        S'installe à côté du DevilutionX habituel. Les nouvelles versions s'installent par-dessus sans perdre les sauvegardes.

        ---
        DevilutionX for the AYN Thor, with the map, character, items and quests on the bottom screen. Install the APK, copy \`DIABDAT.MPQ\` and your saves to \`Android/data/org.diasurgical.devilutionx.thor/files/\`, then start **DevilutionX Thor**.

        Documentation : [docs/ayn-thor.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/ayn-thor.md)
        NOTES
        gh release create "$tag" devilutionx-thor.apk \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "DevilutionX Thor ${version}" \
          --notes-file release-notes.md \
          --latest
